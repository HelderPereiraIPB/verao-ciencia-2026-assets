<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Babylon.js -- motor 3D</title>
  <style>html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
  var canvas = document.getElementById("canvas");
  var engine = new BABYLON.Engine(canvas, true);
  var scene = new BABYLON.Scene(engine);

  var camera = new BABYLON.ArcRotateCamera(
    "cam", -Math.PI / 2, Math.PI / 2.5, 6, BABYLON.Vector3.Zero(), scene
  );
  camera.attachControl(canvas, true); // controlo de orbita com o rato, de graca

  var light = new BABYLON.HemisphericLight("luz", new BABYLON.Vector3(0, 1, 0), scene);

  var box = BABYLON.MeshBuilder.CreateBox("caixa", { size: 2 }, scene);
  var boxMat = new BABYLON.StandardMaterial("caixaMat", scene);
  boxMat.diffuseColor = new BABYLON.Color3(0.13, 0.4, 0.8);
  box.material = boxMat;

  scene.registerBeforeRender(function () {
    box.rotation.y += 0.01;
  });

  engine.runRenderLoop(function () { scene.render(); });
  window.addEventListener("resize", function () { engine.resize(); });
</script>
</body>
</html>
